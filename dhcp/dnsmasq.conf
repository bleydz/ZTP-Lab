# DHCP only, no DNS
port=0
interface=eth1
bind-interfaces
log-dhcp
log-facility=/var/log/dnsmasq.log
dhcp-leasefile=/var/lib/misc/dnsmasq.leases

# Provisioning network
dhcp-range=10.0.0.100,10.0.0.150,255.255.255.0,1h
dhcp-option=option:router,10.0.0.1

# Notify the provisioner on every lease change (add / old / del)
dhcp-script=/etc/ztp/lease-hook.sh

# Fixed reservations keyed on the hostname each device sends
dhcp-host=spine1,10.0.0.21
dhcp-host=leaf1,10.0.0.11
dhcp-host=leaf2,10.0.0.12
